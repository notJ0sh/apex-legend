<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maintenance Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 800px;">
    <div class="card shadow-lg border-warning">
        <div class="card-header bg-warning text-dark">
            <h3 class="mb-0"><i class="bi bi-tools"></i> Configure Maintenance Mode</h3>
        </div>
        <div class="card-body">
            <form action="{{ url_for('confirm_maintenance') }}" method="POST">
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Estimated Duration:</label>
                    <input type="text" name="duration" class="form-control form-control-lg" placeholder="e.g. 2 hours, 30 minutes" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Select Departments to Block:</label>
                    <div class="card p-3" style="max-height: 150px; overflow-y: auto;">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="departments" value="ALL_DEPARTMENTS" id="dept_all">
                            <label class="form-check-label fw-bold text-danger" for="dept_all">Block Entire System (Everyone)</label>
                        </div>
                        <hr>
                        {% for dept in departments %}
                            {% if dept %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="departments" value="{{ dept }}">
                                <label class="form-check-label">{{ dept }}</label>
                            </div>
                            {% endif %}
                        {% endfor %}
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Select Specific Users to Block (Optional):</label>
                    <div class="card p-3" style="max-height: 200px; overflow-y: auto;">
                        {% for user in users %}
                            {% if user.username != 'admin' %} <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="users" value="{{ user.username }}">
                                <label class="form-check-label">{{ user.username }} ({{ user.user_role }})</label>
                            </div>
                            {% endif %}
                        {% endfor %}
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-bold btn-lg">
                        <i class="bi bi-lock-fill"></i> Activate Lockdown
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
