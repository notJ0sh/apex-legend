{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    
    <h2 class="mb-4">Dashboard Overview</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3 shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Total Users</h5>
                    <p class="display-4 fw-bold">{{ stats.total }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success mb-3 shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Active Users</h5>
                    <p class="display-4 fw-bold">{{ stats.active }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-dark bg-warning mb-3 shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">Deleted Users</h5>
                    <p class="display-4 fw-bold">{{ stats.suspended }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-dark bg-info mb-3 shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">New Users</h5>
                    <p class="display-4 fw-bold">{{ stats.new }}</p>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4 border-secondary">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <span><i class="bi bi-megaphone-fill me-2"></i> System Broadcast</span>
            <small>Send an alert to all users</small>
        </div>
        <div class="card-body bg-light">
            <form action="{{ url_for('post_broadcast') }}" method="POST" class="d-flex gap-2">
                <input type="text" name="message" class="form-control" 
                       placeholder="Type announcement here..." 
                       value="{{ current_broadcast }}" required>
                <button type="submit" class="btn btn-secondary fw-bold">Post Alert</button>
                <button type="submit" name="message" value="" class="btn btn-outline-secondary">Clear</button>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white"><h5 class="mb-0">User Status</h5></div>
                <div class="card-body"><div id="piechart_3d" style="width: 100%; height: 300px;"></div></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white"><h5 class="mb-0">Live Session Activity</h5></div>
                <div class="card-body"><div id="linechart_material" style="width: 100%; height: 300px;"></div></div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script type="text/javascript">
  google.charts.load('current', {'packages':['corechart', 'line']});
  google.charts.setOnLoadCallback(drawCharts);

  function drawCharts() {
    drawPieChart();
    drawLineChart();
  }

  function drawPieChart() {
    var data = google.visualization.arrayToDataTable({{ pie_data | tojson }});
    var options = { is3D: true, backgroundColor: 'transparent', chartArea: {width: '90%', height: '80%'}, legend: {position: 'bottom'} };
    var chart = new google.visualization.PieChart(document.getElementById('piechart_3d'));
    chart.draw(data, options);
  }

  function drawLineChart() {
    var data = google.visualization.arrayToDataTable({{ line_data | tojson }});
    var options = { 
        chart: { title: 'User Activity', subtitle: 'Real-time Active Users tracking' }, 
        height: 300, 
        backgroundColor: 'transparent',
        hAxis: { showTextEvery: 1 }
    };
    var chart = new google.charts.Line(document.getElementById('linechart_material'));
    chart.draw(data, google.charts.Line.convertOptions(options));
  }
</script>
{% endblock %}
