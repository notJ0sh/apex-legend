<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Site Under Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #2b2b2b 0%, #1a1a1a 100%); 
            color: white;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Segoe UI', sans-serif;
        }
        .maintenance-card { 
            text-align: center; 
            padding: 50px; 
            border-radius: 20px; 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            max-width: 500px;
        }
        .icon-box { font-size: 80px; margin-bottom: 20px; }
        .duration-box {
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="icon-box">🚧</div>
        <h1 class="fw-bold">System Maintenance</h1>
        <p class="lead mt-3 text-light">
            Our site is currently undergoing critical updates.
            Non-admin access is temporarily restricted.
        </p>
        
        <div class="duration-box">
            <i class="bi bi-clock-history"></i> Will be done in: {{ duration }}
        </div>

        <div class="mt-5">
            <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm">Try Again</a>
        </div>
    </div>
</body>
</html>
